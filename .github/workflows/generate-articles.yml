name: Gerar rascunhos do site

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      site_slug:
        description: "Identificador do site cadastrado no hub"
        required: true
        type: string
      topic:
        description: "Pauta específica (opcional)"
        required: false
        default: ""
      count:
        description: "Quantidade de rascunhos"
        required: false
        default: "1"

concurrency:
  group: article-generator-${{ github.event.inputs.site_slug || vars.SITE_SLUG || 'scheduled' }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: America/Sao_Paulo
      SITE_SLUG: ${{ github.event.inputs.site_slug || vars.SITE_SLUG }}
      TOPIC: ${{ github.event.inputs.topic || '' }}
      COUNT: ${{ github.event.inputs.count || '1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate configuration
        run: |
          if [ -z "$SITE_SLUG" ]; then
            echo "Configure a repository variable SITE_SLUG or dispatch this workflow with site_slug."
            exit 1
          fi
          node -e 'if (!require("./lib/site-registry").getRegisteredSite(process.env.SITE_SLUG)) { console.error("Site not found in data/sites.json:", process.env.SITE_SLUG); process.exit(1); }'
          if [ -z "${{ secrets.GROK_API_KEY }}" ] && \
             [ -z "${{ secrets.GROQ_API_KEY }}" ] && \
             [ -z "${{ secrets.CEREBRAS_API_KEY }}" ] && \
             [ -z "${{ secrets.OPENROUTER_API_KEY }}" ] && \
             [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Configure at least one supported article-generation provider secret."
            exit 1
          fi

      - name: Generate editorial drafts
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e
          echo "Generating $COUNT draft(s) for $SITE_SLUG"
          if [ -n "$TOPIC" ]; then
            node scripts/generate-article.js --site "$SITE_SLUG" --topic "$TOPIC" --count "$COUNT"
          else
            node scripts/generate-article.js --site "$SITE_SLUG" --count "$COUNT"
          fi

      - name: Stage site-specific drafts and state
        id: changes
        run: |
          CONTENT_DIRECTORY=$(node -e 'process.stdout.write(require("./lib/site-registry").getRegisteredSite(process.env.SITE_SLUG).profile.contentDirectory)')
          STATE_DIRECTORY=".editorial-state/${CONTENT_DIRECTORY#posts/}"
          git add "$CONTENT_DIRECTORY"
          git add -f "$STATE_DIRECTORY"
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "ArticleBot"
          git config user.email "bot@github.com"
          git commit -m "Generate editorial drafts for $SITE_SLUG"
          git push

      - name: Deploy Vercel
        if: steps.changes.outputs.has_changes == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK"
          fi
